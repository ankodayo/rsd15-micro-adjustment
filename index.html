<title>Seven Days of Micro-Adjustment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--ground:#EDE9E2;--chrome:#F6F4F0;--line:#DCD6CC;--ink:#1A1A1C;--body:#4A453E;
  --muted:#7C7568;--faint:#A9A296;--accent:#C874AE;--focus:#5C7FD6}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
  :root{--ground:#141316;--chrome:#1C1B1F;--line:#33313A;--ink:#F0ECE5;--body:#D6D0C7;
        --muted:#A29B92;--faint:#7C7568}}}
:root[data-theme="dark"]{--ground:#141316;--chrome:#1C1B1F;--line:#33313A;--ink:#F0ECE5;
  --body:#D6D0C7;--muted:#A29B92;--faint:#7C7568}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);
  font:400 13.5px/1.55 Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:100vh}
aside{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:hidden}
.brand{padding:26px 26px 20px}
h1{font:600 21px/1.24 Archivo,sans-serif;letter-spacing:-.015em;color:var(--ink);margin:0 0 8px;text-wrap:balance}
.lede{color:var(--muted);font-size:12px;margin:0}
.tabs{display:flex;gap:18px;padding:0 26px 14px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;padding:0 0 6px;cursor:pointer;color:var(--faint);
  font:500 11.5px/1 Archivo,sans-serif;border-bottom:1.5px solid transparent}
.tab:hover{color:var(--body)}
.tab.active{color:var(--ink);border-color:var(--ink)}
.tab:focus-visible,.reset:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
#panel{padding:22px 26px 30px;overflow-y:auto;flex:1}
.pk{font:500 9.5px/1 Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin:22px 0 8px}
.pk:first-child{margin-top:0}
.pid{font:400 26px/1 "IBM Plex Mono",monospace;color:var(--ink);letter-spacing:-.02em}
.pid.small{font:600 17px/1.25 Archivo,sans-serif;letter-spacing:-.01em}
.pmeta{font-size:11.5px;color:var(--muted);margin-top:7px}
.psum{margin:14px 0 0;font-size:13px;line-height:1.6;color:var(--body)}
.quote{margin:12px 0 0;padding:0 0 0 12px;border-left:2px solid var(--line);
  font-size:13px;line-height:1.5;color:var(--muted);font-style:italic}
.pnote{margin:0;font-size:12px;line-height:1.55;color:var(--muted)}
.pfoot{margin-top:20px;font:400 10.5px/1 "IBM Plex Mono",monospace;color:var(--faint)}
.stages{margin-top:20px;display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:9px 1fr;column-gap:10px;align-items:baseline;
  padding:9px 0;border-top:1px solid var(--line)}
.sdot{width:7px;height:7px;border-radius:50%;grid-row:span 2;transform:translateY(-1px)}
.srole{font:500 9.5px/1.4 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sval{grid-column:2;font-size:13px;color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
.sval:hover{border-color:var(--accent)}
.snote{grid-column:2;font:400 11.5px/1.45 Archivo,sans-serif;color:var(--faint);font-style:italic}
.lgset{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.lg{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted)}
.lg i{width:9px;height:9px;border-radius:50%;flex:none}
.freqkey{display:flex;gap:22px;margin:10px 0}
.fk{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.fk i.fkbar{height:3px;border-radius:1.5px;background:var(--faint);flex:none}
.fk i.fkbar.short{width:8px}
.fk i.fkbar.long{width:26px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:400 11px/1 "IBM Plex Mono",monospace;color:var(--body);text-decoration:none;
  border:1px solid var(--line);padding:5px 6px}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.ctx{border-style:dashed;color:var(--faint)}
.reset{margin-top:26px;appearance:none;background:none;border:1px solid var(--line);
  color:var(--muted);font:500 11px/1 Archivo,sans-serif;padding:9px 15px;cursor:pointer}
.reset:hover{color:var(--ink);border-color:var(--faint)}
main{padding:26px 30px 44px;min-width:0}
#stage{background:#F6F4F0;border:1px solid var(--line);overflow:hidden}
#stage svg{display:block;width:100%;height:auto}
#card{padding:16px 26px 18px;border-bottom:1px solid var(--line);min-height:96px}
#card .cid{font:400 16px/1 "IBM Plex Mono",monospace;color:var(--ink)}
#card .cid.small{font:600 14px/1.3 Archivo,sans-serif}
#card .cmeta{font-size:11px;color:var(--faint);margin-top:6px}
#card .cline{font-size:12px;line-height:1.5;color:var(--body);margin-top:8px}
#card .cidle{font-size:11.5px;color:var(--faint)}
.legend{margin-top:14px;display:flex;justify-content:space-between;gap:24px;
  font-size:11px;color:var(--faint)}
@media (max-width:1100px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  /* on a narrow screen the detail would sit off-screen above the map, so it
     becomes a sheet pinned to the bottom of the viewport instead */
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:5;max-height:46vh;
    background:var(--chrome);border-top:1px solid var(--line);
    box-shadow:0 -6px 24px rgba(30,25,20,.10);padding:18px 22px 22px}
  main{padding-bottom:180px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

n C3.","events":["E02","E06","E08","E18"],"count":4}},"codebook":{"CC01":{"id":"CC01","label_jp":"話題固執","label_en":"Topic fixation","definition":"同一話題に戻り続け、話題転換が成立しない（相手が切り替えを試みても再帰する）。","kind":"trigger","source_sheet":"Events list"},"CC02":{"id":"CC02","label_jp":"詳細詰問","label_en":"Interrogative loop","definition":"細部確認・追及質問が連鎖し、相互行為が“尋問モード”に固定される。","kind":"trigger","source_sheet":"Events list"},"CC03":{"id":"CC03","label_jp":"話題逸脱・唐突転換","label_en":"Derailment or abrupt shift","definition":"直前話題との接続が弱いまま別話題へ急転換し、共同の進行が崩れる。","kind":"trigger","source_sheet":"Events list"},"CC04":{"id":"CC04","label_jp":"修復不成立","label_en":"Repair failure","definition":"誤解・聞き返し等が出ても相互理解に回収されず、会話が停滞／断絶する。","kind":"trigger","source_sheet":"Events list"},"CC05":{"id":"CC05","label_jp":"応答遅延・長い沈黙","label_en":"Response latency or prolonged gap","definition":"問い・呼びかけへの返答が遅い／沈黙が長く、相互行為が間延びする。","kind":"trigger","source_sheet":"Events list"},"DS01":{"id":"DS01","label_jp":"自己開示拒否","label_en":"Refusal to disclose","definition":"聞かれた内容に対し明確に答えない／話さない意思を示す。","kind":"trigger","source_sheet":"Events list"},"DS02":{"id":"DS02","label_jp":"隠蔽の兆候","label_en":"Concealment cues","definition":"回避・曖昧化・矛盾を含み、「隠しているかもしれない」兆候が出る。","kind":"trigger","source_sheet":"Events list"},"DS03":{"id":"DS03","label_jp":"話題すり替え（家族側へ）","label_en":"Deflection to family","definition":"問いへの回答が、家族の行為・責任・人物評価にすり替わる。","kind":"trigger","source_sheet":"Events list"},"DS04":{"id":"DS04","label_jp":"不信・被疑を伴う遮断","label_en":"Suspicious withholding","definition":"被疑・不信の表明を含み、情報共有が遮断される（「信用できない」等）。","kind":"trigger","source_sheet":"Events list"},"MC01":{"id":"MC01","label_jp":"反復（質問・発話）","label_en":"Repetition","definition":"同じ質問・同趣旨発話が短時間で繰り返される。","kind":"trigger","source_sheet":"Events list"},"MC02":{"id":"MC02","label_jp":"想起不全による停滞","label_en":"Retrieval failure stall","definition":"言葉・事実が出てこず停滞し、会話が前に進まない。","kind":"trigger","source_sheet":"Events list"},"MC03":{"id":"MC03","label_jp":"事実不一致の確信","label_en":"Confident mismatch","defi <script type="module">/* RSD15 L2 accumulation map — layout + SVG generation.
 *
 * Pure functions: dataset (built by scripts/build_dataset.py from the workbook)
 * in, SVG markup out. No DOM access, so the same module drives the interactive
 * page and the static figures exported by scripts/build.mjs.
 *
 * ORDERING RULE (one axis, used by every view)
 *   Within all four stages, categories are ordered by CONTINUITY OF CONTACT:
 *   from the exchange being sustained (left / top) to the exchange being
 *   interrupted (right / bottom). It orders kind, not quality — a negotiated
 *   pause is not "worse" than an unresolved continuation. The same axis in all
 *   four stages lets a filament's height be read directly, and it keeps the
 *   perceptual-disruption branch adjacent so its fan stays legible.
 *
 * PLACEMENT (no hand-placed coordinates)
 *   - Stage x is fixed; inside a stage each category owns a lane at a fixed x,
 *     positioned by its rank on the continuity axis.
 *   - Field view: row y = chronological position; rows bracket into their call.
 *   - Branch view: node y = the same continuity rank (not a force layout).
 *   - Residue view: x = day, y = residue lane.
 *   - Category labels are placed by a greedy collision-free stagger pass.
 *   - Bloom radius, filament weight and the frequency rule encode RECURRENCE
 *     COUNT ONLY.
 */

const PALETTE = {
  paper: '#F6F4F0', ink: '#1A1A1C', body: '#4A453E', muted: '#7C7568', faint: '#A9A296',
  rule: '#DCD6CC', condition: '#5C7FD6', move: '#EE8446', outcome: '#E2B03C',
  residue: '#C874AE', context: '#4FB09B',
};

/* Continuity axis (sustained → interrupted) and every label now come from
   data/l2-dataset.json, which is built from the raw log by
   scripts/build_dataset.py. Nothing about the categories is defined here. */

/* One hue per stage, varied slightly by continuity rank so neighbouring lanes
   stay separable. Hue difference separates categories; it does not rank them. */
const RAMP = {
  T: ['#6E96E2', '#5C7FD6', '#5A76CE', '#5C6FC6', '#5F68BE', '#5D61B6'],
  M: ['#F2A268', '#EF9455', '#EE8446', '#EA7A3E', '#E77038', '#E56A3C',
      '#E16244', '#DC5C4C', '#D75754', '#D2525C'],
  O: ['#EBC468', '#E7BB54', '#E2B03C', '#DEA736', '#D99E32', '#D4952E',
      '#CF8C2C', '#CA842A', '#C57C28', '#C07426'],
  Z: ['#EE93A6', '#E185B6', '#D079B4', '#BC74BE', '#A671C6', '#8F6ECC'],
};
const FAMILY = { T: 'condition', M: 'move', O: 'outcome', Z: 'residue' };

/* Stage geometry. Widths are proportional to lane counts so the lane pitch is
   near-constant across the whole figure. */
const COLUMNS = {
  T: { x0: 232, x1: 432, title: 'Interaction condition' },
  M: { x0: 508, x1: 858, title: 'Relational move' },
  O: { x0: 934, x1: 1264, title: 'Immediate outcome' },
  Z: { x0: 1340, x1: 1520, title: 'Post-interaction residue' },
};

const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const dayLabel = (iso) => {
  const d = new Date(iso + 'T12:00:00Z');
  return `${DAY_NAMES[d.getUTCDay()]} · ${iso.slice(8)} Jan`;
};

/* ---------------------------------------------------------------- model -- */
function model(data) {
  const events = data.events.slice().sort((a, b) => Number(a.id.slice(1)) - Number(b.id.slice(1)));
  const order = data.order, lanes = {};
  for (const fam of ['T', 'M', 'O', 'Z']) {
    const col = COLUMNS[fam], n = order[fam].length;
    order[fam].forEach((id, i) => {
      const x = n === 1 ? (col.x0 + col.x1) / 2 : col.x0 + (col.x1 - col.x0) * i / (n - 1);
      lanes[id] = { id, index: i, x, color: RAMP[fam][i % RAMP[fam].length],
                    family: FAMILY[fam], label: data.categories[id].label };
    });
  }
  const nodes = {};
  for (const [id, c] of Object.entries(data.categories))
    nodes[id] = { id, label: c.label, type: data.stages[c.stage].title, count: c.count,
                  events: c.events, boundary: c.rationale };
  for (const [id, o] of Object.entries(data.outer || {}))
    nodes[id] = { id, label: o.label, type: o.type, count: 0, events: [], boundary: o.boundary };

  const calls = [];
  for (const e of events) {
    const last = calls[calls.length - 1];
    if (last && last.id === e.call_id) last.events.push(e.id);
    else calls.push({ id: e.call_id, date: e.date, daypart: e.daypart, events: [e.id] });
  }
  const days = [...new Set(events.map((e) => e.date))];
  return { events, lanes, order, calls, days, nodes, relations: data.relations,
           context: data.context, meta: data.meta, categories: data.categories,
           codebook: data.codebook, stages: data.stages };
}

/* --------------------------------------------------------------- helpers -- */
const flow = (pts) => {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2;
    d += ` C${mx.toFixed(1)},${y0.toFixed(1)} ${mx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  return d;
};
const bloom = (x, y, r, color, cls = '', attrs = '') =>
  `<circle class="bloom ${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${color}" ${attrs}/>`;

/* greedy word wrap to at most two lines of ~CH characters */
const CH = 17;
function wrap(text) {
  const words = text.split(/\s+/), lines = [''];
  for (const w of words) {
    const t = (lines[lines.length - 1] + ' ' + w).trim();
    if (t.length <= CH || !lines[lines.length - 1]) lines[lines.length - 1] = t;
    else lines.push(w);
  }
  if (lines.length > 2) { lines[1] = lines.slice(1).join(' '); lines.length = 2; }
  return lines;
}
const textWidth = (lines) => Math.max(...lines.map((l) => l.length)) * 6.4 + 12;

/* Label band: one label per lane, all set at the same angle and the same
   offset from their tick, so the labels read as one ordered diagonal rank.
   No stagger, no leaders — position is given by the tick alone. */
const ANGLE = 50;
function labelBand(m, headY) {
  const items = [];
  for (const fam of ['T', 'M', 'O', 'Z'])
    for (const id of m.order[fam]) items.push({ id, x: m.lanes[id].x, label: m.lanes[id].label });
  const longest = Math.max(...items.map((i) => i.label.length));
  const height = longest * 6.05 * Math.sin(ANGLE * Math.PI / 180) + 26;
  const tickY = Math.round(headY + height);
  const svg = items.map((it) => `<g class="lanehead" data-node="${it.id}" transform="translate(${it.x.toFixed(1)},${tickY - 16}) rotate(-${ANGLE})">
      <text class="lanelabel" x="10" y="4">${esc(it.label)}</text></g>`).join('');
  return { svg, tickY };
}

/* Frequency rule: one aligned mark per lane, length ∝ recurrence. */
function ticks(m, y) {
  let svg = '';
  for (const fam of ['T', 'M', 'O', 'Z'])
    for (const id of m.order[fam]) {
      const L = m.lanes[id], n = m.nodes[id].count, w = 5 + n * 3.4;
      svg += `<g class="lanetick" data-node="${id}">
        <circle cx="${L.x.toFixed(1)}" cy="${y}" r="3.6" fill="${L.color}"/>
        <rect class="freq" x="${(L.x - w / 2).toFixed(1)}" y="${y + 9}" width="${w.toFixed(1)}" height="2.4" rx="1.2" fill="${L.color}"/>
      </g>`;
    }
  return svg;
}

function defs(m) {
  let g = '';
  for (const id of Object.keys(m.lanes)) {
    const c = m.lanes[id].color;
    g += `<radialGradient id="rg-${id}"><stop offset="0" stop-color="${c}" stop-opacity=".95"/>` +
         `<stop offset=".55" stop-color="${c}" stop-opacity=".42"/>` +
         `<stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
  }
  return `<defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="haze" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    ${g}</defs>`;
}

/* =========================================================== FIELD VIEW === */
function fieldView(m, { chrome = true, legend = true } = {}) {
  const W = 1680, ROW = 52, GUT = 208;
  const HEAD = chrome ? 60 : 34;
  const band = labelBand(m, HEAD + 26);
  const TOP = band.tickY + 54;
  const rowY = {}; m.events.forEach((e, i) => { rowY[e.id] = TOP + i * ROW; });
  const lastY = rowY[m.events[m.events.length - 1].id];
  const footerShown = chrome && legend;
  const H = lastY + (footerShown ? 132 : 40);
  const drift = (id, amp) => {
    const L = m.lanes[id], n = m.order[id[0]].length;
    return (n < 2 ? 0 : (L.index / (n - 1) - 0.5) * 2) * amp;
  };

  /* stage headings */
  let heads = '';
  for (const fam of ['T', 'M', 'O', 'Z']) {
    const col = COLUMNS[fam];
    heads += `<text class="stage" x="${((col.x0 + col.x1) / 2).toFixed(1)}" y="${HEAD}" text-anchor="middle">${col.title}</text>`;
  }

  /* day bands, call brackets, gutter */
  let bands = '', gutter = '';
  m.days.forEach((d, i) => {
    const rows = m.events.filter((e) => e.date === d);
    const y0 = rowY[rows[0].id] - ROW / 2, y1 = rowY[rows[rows.length - 1].id] + ROW / 2;
    if (i % 2 === 1) bands += `<rect class="dayband" x="${GUT - 16}" y="${y0}" width="${W - GUT - 24}" height="${y1 - y0}"/>`;
    bands += `<line class="daysep" x1="40" x2="${W - 40}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}"/>`;
    gutter += `<text class="day" x="40" y="${((y0 + y1) / 2 + 4).toFixed(1)}">${dayLabel(d)}</text>`;
  });
  for (const c of m.calls) {
    const rows = c.events.map((id) => rowY[id]);
    const y0 = rows[0] - 16, y1 = rows[rows.length - 1] + 16;
    gutter += `<g class="call">
      <path class="callbracket" d="M${GUT - 46},${y0} L${GUT - 52},${y0} L${GUT - 52},${y1} L${GUT - 46},${y1}"/>
      <text class="calllabel" x="${GUT - 60}" y="${((y0 + y1) / 2 + 3.5).toFixed(1)}" text-anchor="end">${c.daypart}</text></g>`;
  }

  /* filaments */
  let glow = '', lines = '', dots = '', marks = '';
  for (const e of m.events) {
    const y = rowY[e.id];
    const T = m.lanes[e.condition], MV = m.lanes[e.move], O = m.lanes[e.outcome];
    const yT = y + drift(e.condition, 13), yM = y + drift(e.move, 13), yO = y + drift(e.outcome, 8);
    e.residues.forEach((z, k) => {
      const Z = m.lanes[z];
      const yz = y + drift(z, 11) + (e.residues.length > 1 ? (k === 0 ? -7 : 7) : 0);
      const pts = [[T.x, yT], [MV.x, yM], [O.x, yO], [Z.x, yz]];
      const gid = `lg-${e.id}-${z}`;
      glow += `<linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${T.x}" x2="${Z.x}">
        <stop offset="0" stop-color="${T.color}"/><stop offset=".30" stop-color="${MV.color}"/>
        <stop offset=".60" stop-color="${O.color}"/><stop offset="1" stop-color="${Z.color}"/></linearGradient>
        <path class="fil-glow" d="${flow(pts)}" stroke="url(#${gid})"/>`;
      lines += `<path class="fil" data-event="${e.id}" d="${flow(pts)}" stroke="url(#${gid})"/>`;
      dots += bloom(Z.x, yz, 25, `url(#rg-${z})`, 'z', `data-event="${e.id}" data-node="${z}"`);
      marks += `<g class="anchor" data-event="${e.id}" data-node="${z}"><circle cx="${Z.x.toFixed(1)}" cy="${yz.toFixed(1)}" r="3" fill="${Z.color}"/></g>`;
    });
    // all four stages read as one visual system: equal bloom size, equal opacity.
    // nothing about size or shade here carries meaning beyond "this happened".
    dots += bloom(T.x, yT, 25, `url(#rg-${e.condition})`, 't', `data-event="${e.id}" data-node="${e.condition}"`)
          + bloom(MV.x, yM, 25, `url(#rg-${e.move})`, 'm', `data-event="${e.id}" data-node="${e.move}"`)
          + bloom(O.x, yO, 25, `url(#rg-${e.outcome})`, 'o', `data-event="${e.id}" data-node="${e.outcome}"`);
    marks += `<g class="anchor" data-event="${e.id}" data-node="${e.condition}"><circle cx="${T.x.toFixed(1)}" cy="${yT.toFixed(1)}" r="3" fill="${T.color}"/></g>
      <g class="anchor" data-event="${e.id}" data-node="${e.move}"><circle cx="${MV.x.toFixed(1)}" cy="${yM.toFixed(1)}" r="3" fill="${MV.color}"/></g>
      <g class="anchor" data-event="${e.id}" data-node="${e.outcome}"><circle cx="${O.x.toFixed(1)}" cy="${yO.toFixed(1)}" r="3" fill="${O.color}"/></g>`;
    marks += `<text class="eid" data-event="${e.id}" x="${GUT - 24}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${e.id}</text>`;
  }

  let hits = '';
  for (const e of m.events)
    hits += `<rect class="rowhit" data-event="${e.id}" x="40" y="${rowY[e.id] - ROW / 2}" width="${W - 80}" height="${ROW}"/>`;

  let footer = '';
  if (footerShown) {
    const yF = lastY + 58;
    const barY = 2, barH = 2.4;
    footer = `<line class="colrule" x1="40" x2="${W - 40}" y1="${yF - 26}" y2="${yF - 26}"/>
      <g class="key" transform="translate(40,${yF})">
        <path class="fil keyline" d="M0,-4 C22,-4 22,-4 44,-4" stroke="${PALETTE.condition}"/>
        <circle cx="22" cy="-4" r="3.4" fill="${PALETTE.condition}"/>
        <text class="note" x="56" y="0">One line is one recorded event, followed across the four stages.</text>

        <circle cx="18" cy="34" r="3" fill="${PALETTE.muted}"/>
        <rect class="freq" x="10" y="${34 + barY}" width="7" height="${barH}" rx="1.2" fill="${PALETTE.muted}"/>
        <text class="note" x="30" y="38">recorded once</text>
        <circle cx="180" cy="34" r="3" fill="${PALETTE.muted}"/>
        <rect class="freq" x="172" y="${34 + barY}" width="26" height="${barH}" rx="1.2" fill="${PALETTE.muted}"/>
        <text class="note" x="204" y="38">recorded several times — the mark under each label grows with its count</text>
      </g>
      <text class="note" x="${W - 40}" y="${yF}" text-anchor="end">Recurrence, not severity: length and bloom size show how often something</text>
      <text class="note" x="${W - 40}" y="${yF + 16}" text-anchor="end">was recorded — never how serious, distressing, or important it was.</text>`;
  }

  return { W, H, rowY, TOP, ROW,
    svg: `${defs(m)}
      <rect class="paper" x="0" y="0" width="${W}" height="${H}"/>
      <g class="bands">${bands}</g>
      <g class="heads">${heads}${band.svg}${ticks(m, band.tickY)}</g>
      <g class="gutter">${gutter}</g>
      <g class="glowlayer" filter="url(#soft)">${glow}</g>
      <g class="bloomlayer" filter="url(#haze)">${dots}</g>
      <g class="linelayer">${lines}</g>
      <g class="coredots">${dots.replace(/class="bloom /g, 'class="bloom core ')}</g>
      <g class="marks">${marks}</g>
      <g class="hits">${hits}</g>
      ${footer}` };
}

/* ========================================================== BRANCH VIEW === */
function branchView(m) {
  const W = 1680, TOP = 210, BOT = 900, H = 980;
  const Y = {};
  for (const fam of ['T', 'M', 'O', 'Z']) {
    const list = m.order[fam], n = list.length;
    list.forEach((id, i) => { Y[id] = TOP + (BOT - TOP) * (n === 1 ? .5 : i / (n - 1)); });
  }
  let heads = '';
  for (const fam of ['T', 'M', 'O', 'Z']) {
    const col = COLUMNS[fam];
    heads += `<text class="stage" x="${((col.x0 + col.x1) / 2).toFixed(1)}" y="60" text-anchor="middle">${col.title}</text>`;
  }
  const core = m.relations.filter((r) => ['responds_to', 'produces_immediate_outcome', 'leaves_trace'].includes(r.type));
  let glow = '', ribbons = '', nodes = '', labels = '';
  for (const r of core) {
    const a = m.lanes[r.source], b = m.lanes[r.target];
    if (!a || !b) continue;
    const d = flow([[a.x, Y[r.source]], [b.x, Y[r.target]]]);
    const gid = `bg-${r.id}`, w = 2 + r.count * 3.2;
    glow += `<linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${a.x}" x2="${b.x}">
      <stop offset="0" stop-color="${a.color}"/><stop offset="1" stop-color="${b.color}"/></linearGradient>
      <path class="rib-glow" d="${d}" stroke="url(#${gid})" stroke-width="${w + 10}"/>`;
    ribbons += `<path class="rib" data-relation="${r.id}" data-events="${r.events.join(',')}" d="${d}" stroke="url(#${gid})" stroke-width="${w}"/>`;
  }
  for (const fam of ['T', 'M', 'O', 'Z'])
    for (const id of m.order[fam]) {
      const L = m.lanes[id], n = m.nodes[id], y = Y[id], r = 13 + Math.sqrt(n.count) * 11;
      nodes += bloom(L.x, y, r, `url(#rg-${id})`, 'agg', `data-node="${id}"`);
      const lines = wrap(L.label), right = fam !== 'Z';
      labels += `<g class="agglabel" data-node="${id}">
        ${lines.map((l, i) => `<text class="lanelabel" x="${(L.x + (right ? 1 : -1) * (r + 10)).toFixed(1)}" y="${(y - (lines.length - 1) * 6 + i * 12 + 4).toFixed(1)}" text-anchor="${right ? 'start' : 'end'}">${esc(l)}</text>`).join('')}</g>`;
    }
  return { W, H, svg: `${defs(m)}
    <rect class="paper" x="0" y="0" width="${W}" height="${H}"/>
    <g class="heads">${heads}</g>
    <g class="glowlayer" filter="url(#soft)">${glow}</g>
    <g class="bloomlayer" filter="url(#haze)">${nodes}</g>
    <g class="linelayer">${ribbons}</g>
    <g class="aggnodes">${nodes.replace(/class="bloom /g, 'class="bloom core ')}</g>
    <g class="agglabels">${labels}</g>` };
}

/* ========================================================= RESIDUE VIEW === */
function residueView(m) {
  const W = 1680, X0 = 380, X1 = 1520, TOP = 230;
  const NZ = m.order.Z.length, STEP = Math.min(112, 560 / Math.max(1, NZ - 1)), H = TOP + (NZ - 1) * STEP + 230;
  const dayX = {}; m.days.forEach((d, i) => { dayX[d] = X0 + (X1 - X0) * i / (m.days.length - 1); });
  const laneY = {}; m.order.Z.forEach((id, i) => { laneY[id] = TOP + i * STEP; });
  let axis = '', blooms = '', links = '', heads = '', ledger = '';
  m.days.forEach((d) => {
    axis += `<line class="daycol" x1="${dayX[d].toFixed(1)}" x2="${dayX[d].toFixed(1)}" y1="${TOP - 54}" y2="${(TOP + (NZ - 1) * STEP + 64).toFixed(1)}"/>
      <text class="day" x="${dayX[d].toFixed(1)}" y="${TOP - 72}" text-anchor="middle">${dayLabel(d)}</text>`;
  });
  for (const id of m.order.Z) {
    const n = m.nodes[id], c = m.lanes[id].color, y = laneY[id];
    heads += `<g class="reslane" data-node="${id}">
      <text class="reslabel" x="330" y="${(y + 4).toFixed(1)}" text-anchor="end">${esc(n.label)}</text>
      <rect class="freq" x="${(330 - (5 + n.count * 3.4)).toFixed(1)}" y="${y + 14}" width="${(5 + n.count * 3.4).toFixed(1)}" height="2.4" rx="1.2" fill="${c}"/>
      <line class="reslinebase" x1="352" x2="${X1 + 40}" y1="${y}" y2="${y}" stroke="${c}"/></g>`;
  }
  const perCell = {};
  for (const e of m.events) for (const z of e.residues) {
    const key = `${e.date}|${z}`; (perCell[key] = perCell[key] || []).push(e);
  }
  for (const [key, list] of Object.entries(perCell)) {
    const [d, z] = key.split('|'), y = laneY[z];
    list.forEach((e, i) => {
      const x = dayX[d] + (i - (list.length - 1) / 2) * 30;
      blooms += bloom(x, y, 20, `url(#rg-${z})`, 'res', `data-event="${e.id}" data-node="${z}"`);
      blooms += `<text class="resid" data-event="${e.id}" x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle">${e.id.slice(1)}</text>`;
    });
  }
  for (const e of m.events) if (e.residues.length === 2) {
    const [a, b] = e.residues, x = dayX[e.date];
    links += `<path class="coex" data-event="${e.id}" d="${flow([[x, laneY[a]], [x + 44, (laneY[a] + laneY[b]) / 2], [x, laneY[b]]])}"/>`;
  }
  const yL = TOP + (NZ - 1) * STEP + 130;
  ledger += `<text class="note" x="330" y="${yL}" text-anchor="end">residue records to date</text>`;
  let run = 0;
  m.days.forEach((d) => {
    run += m.events.filter((e) => e.date === d).reduce((s, e) => s + e.residues.length, 0);
    ledger += `<text class="run" x="${dayX[d].toFixed(1)}" y="${yL}" text-anchor="middle">${run}</text>`;
  });
  return { W, H, svg: `${defs(m)}
    <rect class="paper" x="0" y="0" width="${W}" height="${H}"/>
    <g class="axis">${axis}</g><g class="heads">${heads}</g>
    <g class="coexlayer">${links}</g>
    <g class="bloomlayer" filter="url(#haze)">${blooms}</g>
    <g class="reslayer">${blooms}</g>
    <g class="ledger">${ledger}</g>` };
}

/* =============================================================== TITLE ==== */
function titleSvg(m, W, sub) {
  return `<text class="ttl" x="40" y="52">Twenty-One Interactional Events</text>
    <text class="sub" x="40" y="80">${esc(sub)}</text>`;
}

/* Interaction layer: mounting, one hover card, one detail panel, zoom/pan.
   Geometry comes from l2-core.js; nothing here computes positions. */

const DATA = window.__L2__;
const M = model(DATA);
const byId = Object.fromEntries(M.events.map((e) => [e.id, e]));
const STAGE = { condition: 'Interaction condition', move: 'Relational move',
                outcome: 'Immediate outcome', residue: 'Post-interaction residue' };
const VIEWS = {
  field:   { build: () => fieldView(M, { chrome: false }), label: 'Seven days' },
  branch:  { build: () => branchView(M),  label: 'Branching' },
  residue: { build: () => residueView(M), label: 'Residue' },
};
let current = 'field', built = {}, sel = null, tf = { k: 1, x: 0, y: 0 };

const stage = document.getElementById('stage');
const panel = document.getElementById('panel');
const card = document.getElementById('card');

function mount(name) {
  current = name;
  if (!built[name]) built[name] = VIEWS[name].build();
  const v = built[name];
  stage.innerHTML = `<svg id="svg" viewBox="0 0 ${v.W} ${v.H}" preserveAspectRatio="xMidYMin meet"><g id="viewport">${v.svg}</g></svg>`;
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.view === name));
  tf = { k: 1, x: 0, y: 0 }; applyTf();
  paint(); wire();
}
const applyTf = () => document.getElementById('viewport')
  .setAttribute('transform', `translate(${tf.x},${tf.y}) scale(${tf.k})`);

/* ------------------------------------------------------------ selection -- */
const eventsOf = (t) => !t ? null : t.kind === 'event' ? new Set([t.id])
  : new Set((M.nodes[t.id]?.events || []).filter((x) => x.startsWith('E')));

function paint() {
  const svg = document.getElementById('svg'); if (!svg) return;
  const set = eventsOf(sel);
  svg.classList.toggle('dimmed', !!sel);
  svg.querySelectorAll('[data-event],[data-node],[data-events]').forEach((el) => {
    let on = false;
    if (set) {
      const ev = el.getAttribute('data-event'), evs = el.getAttribute('data-events'),
            nd = el.getAttribute('data-node');
      if (ev && set.has(ev)) on = true;
      if (evs && evs.split(',').some((x) => set.has(x))) on = true;
      if (nd && sel.kind === 'node' && nd === sel.id) on = true;
    }
    el.classList.toggle('on', on);
  });
}
function select(kind, id) { sel = id ? { kind, id } : null; paint(); renderPanel(); }
window.__reset = () => { sel = null; tf = { k: 1, x: 0, y: 0 }; applyTf(); paint(); renderPanel(); hideCard(); };

/* ---------------------------------------------------------------- panel -- */
function stageRow(role, id, note) {
  const n = M.nodes[id]; if (!n) return '';
  return `<div class="srow"><span class="sdot" style="background:${M.lanes[id].color}"></span>
    <span class="srole">${role}</span>
    <a class="sval" href="#" data-node="${id}">${n.label}</a>
    ${note ? `<span class="snote">${note}</span>` : ''}</div>`;
}
function renderPanel() {
  if (!sel) { panel.innerHTML = restPanel(); return; }
  if (sel.kind === 'event') {
    const e = byId[sel.id];
    const call = M.calls.find((c) => c.id === e.call_id);
    const pos = call.events.length > 1 ? ` · ${call.events.indexOf(e.id) + 1} of ${call.events.length} in this call` : '';
    const ctx = [...e.life_context, ...e.care_context, ...e.media.filter((d) => d !== 'D01')];
    panel.innerHTML = `<div class="pk">Event</div>
      <div class="pid">${e.id}</div>
      <div class="pmeta">${dayLabel(e.date)} · ${e.daypart}${pos}</div>
      <p class="psum">${e.summary}</p>
      ${e.quote_en ? `<blockquote class="quote">“${e.quote_en}”</blockquote>` : ''}
      <div class="stages">
        ${stageRow('Condition', e.condition, [
            e.condition_note || '',
            (e.condition_alt || []).length
              ? 'also touches ' + e.condition_alt.map((c) => M.nodes[c].label.toLowerCase()).join(', ') : ''
          ].filter(Boolean).join(' \u00b7 '))}
        ${stageRow('Move', e.move, e.move_actor === 'Mother' ? 'made by Mother' : '')}
        ${stageRow('Outcome', e.outcome, '')}
        ${e.residues.map((z, i) => stageRow(i ? '' : 'Residue', z, '')).join('')}
      </div>
      ${ctx.length ? `<div class="pk">Situating condition</div>
        <p class="pnote">${ctx.map((c) => M.nodes[c].label).join(' · ')}</p>` : ''}
      <div class="pfoot">L1 card ${e.id}</div>
      <button class="reset" onclick="window.__reset()">Clear</button>`;
  } else {
    const n = M.nodes[sel.id], L = M.lanes[sel.id];
    panel.innerHTML = `<div class="pk">${L ? STAGE[L.family] : n.type}</div>
      <div class="pid small">${n.label}</div>
      <div class="pmeta">Recorded in ${n.count} of 21 events</div>
      <p class="pnote">${n.boundary}</p>
      <div class="pk">Events</div>
      <div class="chips">${n.events.map((x) => x.startsWith('E')
        ? `<a href="#" class="chip" data-goto="${x}">${x}</a>`
        : `<span class="chip ctx">${x}</span>`).join('')}</div>
      <button class="reset" onclick="window.__reset()">Clear</button>`;
    panel.querySelectorAll('[data-goto]').forEach((a) => a.addEventListener('click', (ev) => {
      ev.preventDefault(); select('event', a.dataset.goto);
    }));
  }
}
function restPanel() {
  const swatch = (c, t) => `<span class="lg"><i style="background:${c}"></i>${t}</span>`;
  return `<div class="pk">Legend</div>
    <div class="lgset">
      ${swatch('#5C7FD6', 'Interaction condition')}
      ${swatch('#EE8446', 'Relational move')}
      ${swatch('#E2B03C', 'Immediate outcome')}
      ${swatch('#C874AE', 'Post-interaction residue')}
    </div>
    <p class="pnote">One line is one recorded event, followed left to right across the four stages.</p>
    <div class="freqkey">
      <span class="fk"><i class="fkbar short"></i>recorded once</span>
      <span class="fk"><i class="fkbar long"></i>recorded several times</span>
    </div>
    <p class="pnote">The mark under each label, and the bloom on each line, grow with how often that
      category was recorded — never with how serious, distressing, or important it was.</p>
    <p class="pnote">Categories run left to right from sustained to interrupted contact.</p>`;
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('.sval'); if (!a) return;
  e.preventDefault(); select('node', a.dataset.node);
});

/* ------------------------------------------------------------ hover card -- */
function hit(t) {
  const el = t.closest ? t.closest('[data-event],[data-node]') : null;
  if (!el) return null;
  const ev = el.getAttribute('data-event'), nd = el.getAttribute('data-node');
  if (el.classList.contains('lanehead') || el.classList.contains('lanetick')
      || el.classList.contains('reslane') || el.classList.contains('agg')) return { kind: 'node', id: nd };
  if (ev) return { kind: 'event', id: ev };
  if (nd) return { kind: 'node', id: nd };
  return null;
}
const IDLE = '<div class="cidle">Hover a line or a category to identify it.</div>';
const hideCard = () => { card.innerHTML = IDLE; };
function showCard(h) {
  if (sel && sel.kind === h.kind && sel.id === h.id) return hideCard();
  if (h.kind === 'event') {
    const e = byId[h.id];
    card.innerHTML = `<div class="cid">${e.id}</div>
      <div class="cmeta">${dayLabel(e.date)} · ${e.daypart}</div>
      <div class="cline">${e.summary}</div>`;
  } else {
    const n = M.nodes[h.id], L = M.lanes[h.id];
    card.innerHTML = `<div class="cid small">${n.label}</div>
      <div class="cmeta">${L ? STAGE[L.family] : n.type}</div>
      <div class="cline">Recorded in ${n.count} of 21 events.</div>`;
  }
}
function wire() {
  const svg = document.getElementById('svg');
  svg.addEventListener('mousemove', (e) => { const h = hit(e.target); h ? showCard(h) : hideCard(); });
  svg.addEventListener('mouseleave', hideCard);
  svg.addEventListener('click', (e) => { const h = hit(e.target); h ? select(h.kind, h.id) : select(null); });
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const k = Math.min(6, Math.max(1, tf.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12))), s = k / tf.k;
    tf.x = px - (px - tf.x) * s; tf.y = py - (py - tf.y) * s; tf.k = k;
    if (k === 1) { tf.x = 0; tf.y = 0; }
    applyTf();
  }, { passive: false });
  let drag = null;
  svg.addEventListener('mousedown', (e) => { drag = { x: e.clientX - tf.x, y: e.clientY - tf.y }; });
  window.addEventListener('mouseup', () => { drag = null; });
  window.addEventListener('mousemove', (e) => {
    if (!drag || tf.k === 1) return;
    tf.x = e.clientX - drag.x; tf.y = e.clientY - drag.y; applyTf();
  });
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.__reset(); });
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => mount(b.dataset.view)));
mount('field');
renderPanel();
hideCard();
</script>
